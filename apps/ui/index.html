<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B10" />
    <meta name="description" content="DMR-X — Universal AI Routing Console" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>DMR-X Console</title>
    <script>
      // Apply the persisted theme to <html> *before* the first paint so users
      // who chose light mode never see a dark flash. The store's `theme` key
      // is the same one used by the Topbar switcher; if it's missing or
      // malformed, default to dark.
      (function () {
        try {
          var raw = localStorage.getItem('dmrx-ui');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            // zustand `persist` wraps state in { state, version }.
            var stored = parsed && (parsed.state || parsed);
            if (stored && stored.theme === 'light') theme = 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run DMR-X Console.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
