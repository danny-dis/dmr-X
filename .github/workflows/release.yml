name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0)'
        required: true

# Releases can take a while (multi-arch builds). Set a 60-min budget.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write  # for cosign keyless signing

jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build
      - name: Build UI
        run: bun run build:ui

      # Linux x64
      - name: Compile Linux x64
        working-directory: apps/gateway
        run: |
          bun build --compile --target=bun-linux-x64 \
            --outfile=dist/dmrx-linux-x64 src/main.ts
          mkdir -p dist/public && cp -r public/* dist/public/ 2>/dev/null || true
          tar -czf dmrx-linux-x64.tar.gz -C dist dmrx-linux-x64 public
          mv dmrx-linux-x64.tar.gz dist/

      # Linux arm64
      - name: Compile Linux arm64
        working-directory: apps/gateway
        run: |
          bun build --compile --target=bun-linux-arm64 \
            --outfile=dist/dmrx-linux-arm64 src/main.ts
          mkdir -p dist/public && cp -r public/* dist/public/ 2>/dev/null || true
          tar -czf dmrx-linux-arm64.tar.gz -C dist dmrx-linux-arm64 public
          mv dmrx-linux-arm64.tar.gz dist/

      # macOS x64
      - name: Compile macOS x64
        working-directory: apps/gateway
        run: |
          bun build --compile --target=bun-darwin-x64 \
            --outfile=dist/dmrx-darwin-x64 src/main.ts
          mkdir -p dist/public && cp -r public/* dist/public/ 2>/dev/null || true
          tar -czf dmrx-darwin-x64.tar.gz -C dist dmrx-darwin-x64 public
          mv dmrx-darwin-x64.tar.gz dist/

      # macOS arm64 (Apple Silicon)
      - name: Compile macOS arm64
        working-directory: apps/gateway
        run: |
          bun build --compile --target=bun-darwin-arm64 \
            --outfile=dist/dmrx-darwin-arm64 src/main.ts
          mkdir -p dist/public && cp -r public/* dist/public/ 2>/dev/null || true
          tar -czf dmrx-darwin-arm64.tar.gz -C dist dmrx-darwin-arm64 public
          mv dmrx-darwin-arm64.tar.gz dist/

      # Windows x64
      - name: Compile Windows x64
        working-directory: apps/gateway
        shell: bash
        run: |
          bun build --compile --target=bun-windows-x64 \
            --outfile=dist/dmrx-windows-x64.exe src/main.ts
          mkdir -p dist/public && cp -r public/* dist/public/ 2>/dev/null || true
          cd dist && zip -r dmrx-windows-x64.zip dmrx-windows-x64.exe public/ && cd ..

      - name: Compute checksums
        working-directory: apps/gateway
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee -a checksums.txt
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-x64
          path: apps/gateway/dist/dmrx-linux-x64.tar.gz
      - name: Upload linux arm64
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-arm64
          path: apps/gateway/dist/dmrx-linux-arm64.tar.gz
      - name: Upload darwin x64
        uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin-x64
          path: apps/gateway/dist/dmrx-darwin-x64.tar.gz
      - name: Upload darwin arm64
        uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin-arm64
          path: apps/gateway/dist/dmrx-darwin-arm64.tar.gz
      - name: Upload windows x64
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x64
          path: apps/gateway/dist/dmrx-windows-x64.zip
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: apps/gateway/checksums.txt

  container:
    name: Build & push container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: binaries
    permissions:
      contents: read
      packages: write
      id-token: write  # for cosign keyless signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch node image (Bun runtime + compiled JS)
      - name: Build and push (node, multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          target: production-node
          push: true
          tags: |
            ghcr.io/danny-dis/dmr-x:${{ steps.version.outputs.version }}
            ghcr.io/danny-dis/dmr-x:${{ steps.version.outputs.version }}-node
            ghcr.io/danny-dis/dmr-x:latest
          labels: |
            org.opencontainers.image.title=DMR-X Gateway
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/danny-dis/dmr-X
            org.opencontainers.image.licenses=BSL-1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Single-arch binary image (linux/amd64 only — distroless static variant)
      - name: Build and push (binary, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          target: production-binary
          build-args: |
            BUILD_MODE=binary
            TARGETARCH=amd64
          push: true
          tags: |
            ghcr.io/danny-dis/dmr-x:${{ steps.version.outputs.version }}-binary
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the images with cosign keyless (uses OIDC token from GHA)
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'
      - name: Sign node image
        run: |
          # Request OIDC token from GitHub Actions
          OIDC_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" | jq -r '.value')
          cosign sign --identity-token "$OIDC_TOKEN" --yes \
            ghcr.io/danny-dis/dmr-x:${{ steps.version.outputs.version }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          artifact: ghcr.io/danny-dis/dmr-x:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [binaries, container]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Read CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          V="${VERSION#v}"
          awk -v ver="$V" '
            /^## / {
              if (in_section && found) exit
              if ($0 ~ "## " ver " ") { in_section=1; found=1 }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## $VERSION" > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](https://github.com/danny-dis/dmr-X/blob/$VERSION/CHANGELOG.md) for the full list of changes." >> release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            artifacts/binaries-linux-x64/*.tar.gz
            artifacts/binaries-linux-arm64/*.tar.gz
            artifacts/binaries-darwin-x64/*.tar.gz
            artifacts/binaries-darwin-arm64/*.tar.gz
            artifacts/binaries-windows-x64/*.zip
            artifacts/checksums/checksums.txt
            artifacts/sbom/sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
