[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmrx"
version = "0.5.9"
description = "Python SDK for DMR-X — Universal AI routing and orchestration"
readme = "README.md"
description-content-type = "text/markdown"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "DMR-X Contributors" },
]
keywords = [
    "ai", "llm", "gateway", "openai", "anthropic", "gemini",
    "router", "mcp", "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx >= 0.27, < 1",
    "pydantic >= 2.0, < 3",
    "typing-extensions >= 4.9",
]

[project.optional-dependencies]
langchain = ["langchain-core >= 0.3"]
llama-index = ["llama-index-core >= 0.12"]
langfuse = ["langfuse >= 2.58"]
mlflow = ["mlflow >= 2.16"]
all = ["dmrx[langchain,llama-index,langfuse,mlflow]"]

[project.urls]
"Homepage" = "https://dmr-x.io"
"Documentation" = "https://docs.dmr-x.io"
"Source" = "https://github.com/dmr-x/dmr-x"
"Issues" = "https://github.com/dmr-x/dmr-x/issues"

[tool.hatch.build.targets.wheel]
packages = ["dmrx"]

[tool.hatch.build.targets.sdist]
include = ["dmrx/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
