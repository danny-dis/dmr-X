  *{box-sizing:border-box;margin:0;padding:0}

  .hud{position:fixed;z-index:5;pointer-events:none}
  header{top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .title{font-weight:700;font-size:20px;letter-spacing:.5px}
  .title small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:3px}
  .stat{font-size:12px;color:var(--dim);text-align:right;line-height:1.6}
  .stat b{color:var(--accent);font-size:14px}

  .search{flex:1;min-width:220px;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--txt);font-size:14px;outline:none}

  .chips{display:flex;gap:6px;flex-wrap:wrap;max-width:62vw;overflow:auto;max-height:46px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:11px;color:var(--dim);cursor:pointer;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:6px}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip.on{color:#fff;border-color:rgba(150,180,255,.6);background:rgba(40,60,120,.6)}
  .chip:hover{color:#fff}
  .panel{position:fixed;top:50%;right:22px;transform:translateY(-50%);width:320px;max-height:74vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;z-index:6;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5);display:none}
  .panel.show{display:block;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.96)}to{opacity:1;transform:translateY(-50%) scale(1)}}
  .panel h2{font-size:18px;margin-bottom:4px}
  .panel .cat{font-size:12px;color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .panel .cat .dot{width:10px;height:10px;border-radius:50%}
  .panel p{font-size:13px;line-height:1.55;color:#c4cdf0;margin-bottom:14px}
  .panel .row{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-top:1px solid var(--line)}
  .panel .row span:first-child{color:var(--dim)}
  .panel .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .panel .tools span{background:rgba(80,110,200,.22);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px}
  .close{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--dim);font-size:18px;line-height:1}
  .close:hover{color:#fff}
  .hint{position:fixed;bottom:70px;left:22px;font-size:11px;color:var(--dim);z-index:5;pointer-events:none}
</style>
</head>

const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=canvas.width=innerWidth*DPR; H=canvas.height=innerHeight*DPR; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; }
addEventListener('resize', resize); resize();
const view={scale:1, ox:0, oy:0};
let dragging=false, lastX=0, lastY=0;
const starsInit = ()=> DATA.agents.map((a,i)=>({ ...a, i, sx:a.x, sy:a.y, r:1.6+Math.min(a.ntools,6)*0.9, tw:Math.random()*Math.PI*2 }));
let stars = starsInit();
const active=new Set(); let searchTerm='';
function matches(a){ if(searchTerm && !(a.name.toLowerCase().includes(searchTerm)||a.category.toLowerCase().includes(searchTerm))) return false; if(active.size && !active.has(a.category)) return false; return true; }
const chipsEl=document.getElementById('chips');
function buildChips(){
  chipsEl.innerHTML='';
  for(const [cat,n] of Object.entries(DATA.categories).sort((a,b)=>b[1]-a[1])){
    const c=document.createElement('div'); c.className='chip'; c.dataset.cat=cat;
    c.innerHTML='<span class="dot" style="background:'+(DATA.colormap[cat]||'#fff')+'"></span>'+cat+' <span style="opacity:.6">'+n+'</span>';
    c.onclick=()=>{ if(active.has(cat)){active.delete(cat);c.classList.remove('on');} else {active.add(cat);c.classList.add('on');} };
    chipsEl.appendChild(c);
  }
}
buildChips();
document.getElementById('search').addEventListener('input', e=>{ searchTerm=e.target.value.trim().toLowerCase(); });
canvas.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
addEventListener('mouseup', ()=>dragging=false);
addEventListener('mousemove', e=>{ if(dragging){ view.ox+=(e.clientX-lastX); view.oy+=(e.clientY-lastY); lastX=e.clientX; lastY=e.clientY; } hover(e); });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.12:0.89; view.scale=Math.max(0.4,Math.min(6,view.scale*f)); },{passive:false});
canvas.addEventListener('click', e=>{ const hit=pick(e); if(hit) showPanel(hit); else closePanel(); });
function toScreen(a){ const cx=W/2+view.ox, cy=H/2+view.oy; return [ cx+(a.sx-0.5)*W*view.scale, cy+(a.sy-0.5)*H*view.scale ]; }
let mouseX=-1, mouseY=-1;
function hover(e){ mouseX=e.clientX*DPR; mouseY=e.clientY*DPR; }
function pick(e){ const mx=e.clientX*DPR, my=e.clientY*DPR; let best=null, bd=18*DPR; for(const s of stars){ if(!matches(s)) continue; const [x,y]=toScreen(s); const d=Math.hypot(x-mx,y-my); if(d<bd){ bd=d; best=s; } } return best; }
const panel=document.getElementById('panel');
function showPanel(s){
  document.getElementById('pName').textContent=s.name;
  const dot=document.getElementById('pDot'); dot.style.background=s.color;
  document.getElementById('pCat').textContent=s.category;
  document.getElementById('pDesc').textContent=s.desc;
  document.getElementById('pTier').textContent=s.tier;
  document.getElementById('pModel').textContent=s.model? s.model : '(auto — router picks best)';
  document.getElementById('pNtools').textContent=s.ntools;
  const t=document.getElementById('pTools'); t.innerHTML='';
  if(s.tools.length){ for(const tool of s.tools){ const sp=document.createElement('span'); sp.textContent=tool; t.appendChild(sp); } }
  else { const sp=document.createElement('span'); sp.textContent='none'; t.appendChild(sp); }
  document.getElementById('pNote').textContent = s.bright>=1 ? 'Repair-tier: has execute_code (can touch host repo).' : 'No coding tool granted.';
  panel.classList.add('show');
}
function closePanel(){ panel.classList.remove('show'); }
let frame=0;
function draw(){
  frame++; ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(40,55,130,0.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  let visible=0;
  for(const s of stars){
    const on=matches(s); if(on) visible++;
    const [x,y]=toScreen(s); if(x<-40||x>W+40||y<-40||y>H+40) continue;
    const tw=0.75+0.25*Math.sin(frame*0.04+s.tw);
    const a=on? s.bright*tw : s.bright*tw*0.12;
    const rr=s.r*DPR*(0.8+0.4*tw)*Math.sqrt(view.scale);
    const rg=ctx.createRadialGradient(x,y,0,x,y,rr*5);
    rg.addColorStop(0,hexA(s.color,a)); rg.addColorStop(1,hexA(s.color,0));
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,rr*5,0,7); ctx.fill();
    ctx.fillStyle=hexA('#ffffff',a); ctx.beginPath(); ctx.arc(x,y,rr*0.6,0,7); ctx.fill();
    ctx.fillStyle=hexA(s.color,a); ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill();
  }
  document.getElementById('visN').textContent=visible;
  document.getElementById('catN').textContent=Object.keys(DATA.categories).length;
  if(mouseX>=0){ const hit=pick({clientX:mouseX/DPR,clientY:mouseY/DPR}); if(hit){ const [x,y]=toScreen(hit); ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5*DPR; ctx.beginPath(); ctx.arc(x,y,hit.r*DPR*4,0,7); ctx.stroke(); ctx.fillStyle='#fff'; ctx.font=(13*DPR)+'px Segoe UI'; ctx.textAlign='center'; ctx.fillText(hit.name,x,y-hit.r*DPR*5-8*DPR); } }
  requestAnimationFrame(draw);
}
function hexA(hex,a){ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.replace(/(.)/g,'$1$1'):h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return 'rgba('+r+','+g+','+b+','+a+')'; }
draw();
let idleT=0; addEventListener('mousemove',()=>idleT=0);
setInterval(()=>{ if(!dragging){ idleT++; view.ox+=Math.sin(idleT*0.003)*0.15; view.oy+=Math.cos(idleT*0.0023)*0.1; } }, 30);

const COLORMAP = {"Engineering":"#4f9dff","Specialized":"#b388ff","Marketing":"#ff6ec7","Game Development":"#ffb347","GIS":"#5ce1a6","Security":"#ff5c5c","Testing":"#ffe066","Support":"#9ad0ff","Sales":"#7CFC00","Project Management":"#c0a16b","Product":"#ff9f6e","Paid Media":"#ff85c2","Healthcare":"#7ad7f0","Finance":"#d4af37","Design":"#c792ea","Academic":"#a0e7a0","Spatial Computing":"#8ef0d0","Operations":"#cfcfcf","Research":"#f0a6ff"};
function hashPos(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return (h%1000)/1000; }
function transform(raw){
  const items = (raw.items||[]).filter(a=>!a.isPrivate && a.name && a.category);
  const cats={}; const agents=[];
  for(const a of items){
    const cat=a.category||'Specialized';
    cats[cat]=(cats[cat]||0)+1;
    const ang=hashPos(a.name+'_a')*Math.PI*2;
    const rad=Math.sqrt(hashPos(a.name+'_r'));
    const x=0.5+0.46*rad*Math.cos(ang), y=0.5+0.46*rad*Math.sin(ang);
    const rawTools = [].concat(a.allowedTools||[], a.grantedTools||a.customTools||[]);
    const tools = rawTools.filter(t=>typeof t==='string');
    agents.push({ name:a.name, category:cat, color:COLORMAP[cat]||'#ffffff', tools, ntools:tools.length,
      desc:(a.description||'').slice(0,300), tier:a.modelTier||'auto', model:a.preferredModel||null,
      bright:(tools.indexOf('execute_code')>=0)?1:0.55, x:Math.round(x*1e4)/1e4, y:Math.round(y*1e4)/1e4 });
  }
  return { total:agents.length, categories:cats, colormap:COLORMAP, agents };
}
async function loadLive(){
  try{
    const res = await fetch('/v1/agents?limit=500', {headers:{'x-cost-filter':'all'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = await res.json();
    const next = transform(raw);
    if(next.agents.length){
      DATA = next; stars = starsInit(); buildChips();
      const src=document.getElementById('srcTag'); if(src) src.textContent='LIVE — gateway';
    }
  }catch(e){ const src=document.getElementById('srcTag'); if(src) src.textContent='EMBEDDED (gateway offline)'; }
}
loadLive();

</script>
