{{- if or .Values.dmrx.adminApiKey .Values.dmrx.encryptionKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmr-x.fullname" . }}-secrets
  namespace: {{ include "dmr-x.namespace" . }}
  labels:
    {{- include "dmr-x.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.dmrx.adminApiKey }}
  admin-api-key: {{ .Values.dmrx.adminApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.dmrx.encryptionKey }}
  encryption-key: {{ .Values.dmrx.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- range $name, $config := .Values.providers }}
  {{- if $config.apiKey }}
  {{ $name }}-api-key: {{ $config.apiKey | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
