# Prometheus scrape config for DMR-X.
#
# Mounted at /etc/prometheus/prometheus.yml inside the prometheus
# container. The gateway is reached via the docker-compose network
# (service name `gateway`). The :9464 port is the TelemetryService's
# own HTTP server — Fastify's main port (3000) is for traffic only.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dmr-x
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # The gateway's TelemetryService exports Prometheus metrics on :9464/metrics
  - job_name: dmr-x
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - gateway:9464
        labels:
          service: dmr-x
          env: production

  # The gateway's /healthz and /ready are scraped by blackbox-style probes
  # via a separate job. If you don't run blackbox_exporter, remove this.
  # - job_name: dmr-x-probes
  #   metrics_path: /probe
  #   params:
  #     module: [http_2xx]
  #   static_configs:
  #     - targets:
  #         - http://gateway:3000/healthz
  #         - http://gateway:3000/ready
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target__
  #     - source_labels: [__param_target__]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox:9115

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
