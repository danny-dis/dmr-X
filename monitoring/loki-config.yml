# Minimal Loki config for DMR-X.
# Mounted at /etc/loki/config.yml inside the loki container.
# Single-instance, local filesystem storage. For HA, swap the
# filesystem store for S3/GCS and add a chunk store config.

server:
  http_listen_port: 3100

common:
  ring:
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # Keep logs for 30 days. Bump to 90+ for compliance use cases.
  retention_period: 744h
  # 5 MB max line — anything bigger is probably a stack trace from a
  # leaked secret, which we want to drop.
  max_line_size: 5MB
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
