services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DMRX_LOCAL_MODE: "false"
      DMRX_ADMIN_API_KEY: ${DMRX_ADMIN_API_KEY:?DMRX_ADMIN_API_KEY is required}
      DMRX_ENCRYPTION_KEY: ${DMRX_ENCRYPTION_KEY:?DMRX_ENCRYPTION_KEY is required}
      DMRX_CORS_ORIGIN: ${DMRX_CORS_ORIGIN:?DMRX_CORS_ORIGIN is required}
    volumes:
      # The Dockerfile sets DMRX_DATA_DIR=/app/data — this is where the app
      # actually writes the SQLite DB. Mounting elsewhere persists nothing (O1).
      - dmr-x-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dmr-x-data:
